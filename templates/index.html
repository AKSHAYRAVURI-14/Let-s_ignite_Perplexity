<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ouro AI — Pearl Crystal Intelligence</title>
    <!-- Modern Elegant Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Phosphor Icons -->
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"/>
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css"/>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .ph-spin { animation: spin 1s linear infinite; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="logo">
                <div class="logo-icon-wrapper">
                    <i class="ph ph-sparkle"></i>
                </div>
                <span>Ouro AI</span>
            </div>
            <nav>
                <div class="nav-item active" id="btn-new-chat"><i class="ph ph-plus"></i> New Chat</div>
                <div class="nav-item" id="btn-history"><i class="ph ph-clock-counter-clockwise"></i> History</div>
                <div id="history-list" class="hidden" style="display: flex; flex-direction: column; gap: 6px; margin-left: 16px; margin-bottom: 12px; font-size: 13px; max-height: 220px; overflow-y: auto;"></div>
                <div class="nav-item"><i class="ph ph-gear-six"></i> Settings</div>
            </nav>
            <div class="sidebar-footer">
                <div class="crystal-pill"><i class="ph ph-diamonds-four"></i> Crystal Engine 2.5</div>
            </div>
        </aside>

        <main class="chat-wrapper">
            <header class="top-nav">
                <button id="menu-toggle" class="icon-btn"><i class="ph ph-list"></i></button>
                <div class="status-badge"><i class="ph ph-diamonds-four"></i> CRYSTAL PRO</div>
                <div class="user-avatar" title="Account">N</div>
            </header>

            <div class="welcome-container" id="welcome-screen">
                <div class="crystal-hero-badge">
                    <i class="ph ph-sparkle"></i> Next-Gen Intelligence
                </div>
                <h1 class="greeting">Clarity meets intelligence.<br><span>What would you like to explore?</span></h1>
                
                <div class="input-area">
                    <div id="file-preview-container" class="hidden">
                        <img id="file-preview-image">
                        <span id="file-preview-name"></span>
                        <button id="remove-file-btn" title="Remove file"><i class="ph ph-x"></i></button>
                    </div>
                    <div class="search-bar-container">
                        <textarea id="user-input" placeholder="Ask anything, analyze documents, or explore ideas..." rows="1"></textarea>
                        <div class="actions">
                            <input type="file" id="file-upload" accept="image/*,.pdf,.docx" style="display: none;">
                            <button id="upload-btn" title="Upload file or document"><i class="ph ph-paperclip"></i></button>
                            <button id="web-btn" title="Live Web Search"><i class="ph ph-globe"></i></button>
                            <button id="mic-btn" title="Voice dictation"><i class="ph ph-microphone"></i></button>
                            <button id="send-btn" class="send-btn" title="Send message"><i class="ph ph-arrow-up"></i></button>
                        </div>
                    </div>
                </div>

                <div class="suggestion-chips">
                    <button class="chip"><i class="ph ph-sparkle"></i> Synthesize insights</button>
                    <button class="chip"><i class="ph ph-file-text"></i> Analyze document</button>
                    <button class="chip"><i class="ph ph-code"></i> Code architecture</button>
                    <button class="chip"><i class="ph ph-globe"></i> Deep web research</button>
                </div>
            </div>

            <!-- This container will hold the actual conversation -->
            <div id="chat-history" class="chat-history hidden"></div>
        </main>
    </div>

    <!-- Loading animation -->
    <div id="loader" class="loader hidden">
        <div class="pulse"></div>
    </div>

    <!-- Import marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
